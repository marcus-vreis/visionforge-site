# pt.ts and en.ts are the same page in two languages: their keys and layout
# are parallel by design, so every new line inside them counts as duplicated
# against the other file. Translations are not copy-paste to refactor away.
# feature-guides.ts holds each guide in both languages side by side, for the
# same reason.
sonar.cpd.exclusions=src/content/pt.ts,src/content/en.ts,src/content/feature-guides.ts
